name: Build FisherSafe APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm install

      - name: Create Android project
        run: npx cap add android

      - name: Configure Android project
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("android/variables.gradle")
          text = path.read_text()

          text = text.replace(
              "minSdkVersion = 23",
              "minSdkVersion = 23"
          )

          text = text.replace(
              "compileSdkVersion = 35",
              "compileSdkVersion = 35"
          )

          text = text.replace(
              "targetSdkVersion = 35",
              "targetSdkVersion = 35"
          )

          path.write_text(text)
          PY

      - name: Copy web application
        run: npx cap copy android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk FisherSafe.apk

      - name: Verify APK
        run: |
          ls -lh FisherSafe.apk
          file FisherSafe.apk

      - name: Upload FisherSafe APK
        uses: actions/upload-artifact@v4
        with:
          name: FisherSafe-Android-10-Compatible
          path: FisherSafe.apk
          if-no-files-found: error
