name: Build FisherSafe Signed APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------
      # 1. Checkout repository
      # --------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # --------------------------------------------------
      # 2. Setup Node.js
      # --------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # --------------------------------------------------
      # 3. Setup Java 21
      # --------------------------------------------------
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # --------------------------------------------------
      # 4. Install dependencies
      # --------------------------------------------------
      - name: Install dependencies
        run: npm install

      # --------------------------------------------------
      # 5. Install TypeScript
      # --------------------------------------------------
      - name: Ensure TypeScript is installed
        run: npm install --save-dev typescript

      # --------------------------------------------------
      # 6. Create Android project
      # --------------------------------------------------
      - name: Create Android project
        run: npx cap add android

      # --------------------------------------------------
      # 7. Replace AndroidManifest.xml with valid manifest
      # --------------------------------------------------
      - name: Configure Android permissions
        run: |
          cat > android/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <!-- GPS / Location permissions -->
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />

              <!-- Microphone permission -->
              <uses-permission android:name="android.permission.RECORD_AUDIO" />

              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="@string/app_name"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:supportsRtl="true"
                  android:theme="@style/AppTheme"
                  android:usesCleartextTraffic="true">

                  <activity
                      android:name=".MainActivity"
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|locale|smallestScreenSize|screenLayout|uiMode"
                      android:exported="true"
                      android:label="@string/title_activity_main"
                      android:launchMode="singleTask"
                      android:screenOrientation="unspecified"
                      android:theme="@style/AppTheme.NoActionBar"
                      android:windowSoftInputMode="adjustResize">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

          echo "Valid AndroidManifest.xml created."

      # --------------------------------------------------
      # 8. Configure Java 21
      # --------------------------------------------------
      - name: Configure Java 21 compatibility
        run: |
          python3 - <<'PY'
          from pathlib import Path

          file = Path("android/app/build.gradle")
          text = file.read_text()

          if "compileOptions" not in text:
              text = text.replace(
                  "android {",
                  """android {

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_21
                  targetCompatibility JavaVersion.VERSION_21
              }
              """,
                  1
              )

          file.write_text(text)
          print("Java 21 compatibility configured.")
          PY

      # --------------------------------------------------
      # 9. Copy web application
      # --------------------------------------------------
      - name: Copy web application
        run: npx cap copy android

      # --------------------------------------------------
      # 10. Sync Capacitor
      # --------------------------------------------------
      - name: Sync Capacitor
        run: npx cap sync android

      # --------------------------------------------------
      # 11. Verify manifest
      # --------------------------------------------------
      - name: Verify Android manifest
        run: |
          echo "========== AndroidManifest.xml =========="
          cat android/app/src/main/AndroidManifest.xml
          echo "========================================"

      # --------------------------------------------------
      # 12. Generate release keystore
      # --------------------------------------------------
      - name: Generate release keystore
        run: |
          keytool -genkeypair \
            -v \
            -keystore fisherSafe-release.keystore \
            -alias fishersafe \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass FisherSafe123 \
            -keypass FisherSafe123 \
            -dname "CN=FisherSafe, OU=Research, O=FisherSafe, L=Uyo, ST=Akwa Ibom, C=NG"

      # --------------------------------------------------
      # 13. Configure signing
      # --------------------------------------------------
      - name: Configure release signing
        run: |
          cat >> android/gradle.properties <<'EOF'

          FISHERSAFE_KEYSTORE=../fisherSafe-release.keystore
          FISHERSAFE_KEY_ALIAS=fishersafe
          FISHERSAFE_KEYSTORE_PASSWORD=FisherSafe123
          FISHERSAFE_KEY_PASSWORD=FisherSafe123
          EOF

          python3 - <<'PY'
          from pathlib import Path

          file = Path("android/app/build.gradle")
          text = file.read_text()

          if "signingConfigs {" not in text:
              signing = """
              signingConfigs {
                  release {
                      storeFile file(project.findProperty("FISHERSAFE_KEYSTORE"))
                      storePassword project.findProperty("FISHERSAFE_KEYSTORE_PASSWORD")
                      keyAlias project.findProperty("FISHERSAFE_KEY_ALIAS")
                      keyPassword project.findProperty("FISHERSAFE_KEY_PASSWORD")
                  }
              }
              """

              text = text.replace(
                  "android {",
                  "android {" + signing,
                  1
              )

          if "signingConfig signingConfigs.release" not in text:
              text = text.replace(
                  "buildTypes {",
                  """buildTypes {
                      release {
                          signingConfig signingConfigs.release
                          minifyEnabled false
                          shrinkResources false
                      }
                  """,
                  1
              )

          file.write_text(text)
          print("Release signing configured.")
          PY

      # --------------------------------------------------
      # 14. Build signed release APK
      # --------------------------------------------------
      - name: Build FisherSafe release APK
        working-directory: android
        run: ./gradlew assembleRelease --stacktrace

      # --------------------------------------------------
      # 15. Locate APK
      # --------------------------------------------------
      - name: Locate APK
        run: |
          echo "========== APK FILES =========="
          find android/app/build/outputs -type f -name "*.apk" -print
          echo "==============================="

      # --------------------------------------------------
      # 16. Rename final APK
      # --------------------------------------------------
      - name: Prepare final APK
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk FisherSafe-release.apk
          ls -lh FisherSafe-release.apk

      # --------------------------------------------------
      # 17. Upload final APK
      # --------------------------------------------------
      - name: Upload FisherSafe release APK
        uses: actions/upload-artifact@v4
        with:
          name: FisherSafe-release-apk
          path: FisherSafe-release.apk
          if-no-files-found: error
