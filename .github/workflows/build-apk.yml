
name: Build FisherSafe Signed APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------
      # 1. Checkout project
      # --------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # --------------------------------------------------
      # 2. Setup Node.js
      # --------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # --------------------------------------------------
      # 3. Setup Java 21
      # --------------------------------------------------
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # --------------------------------------------------
      # 4. Install project dependencies
      # --------------------------------------------------
      - name: Install dependencies
        run: npm install

      # --------------------------------------------------
      # 5. Ensure TypeScript is installed
      # --------------------------------------------------
      - name: Install TypeScript
        run: npm install --save-dev typescript

      # --------------------------------------------------
      # 6. Create Android project
      # --------------------------------------------------
      - name: Create Android project
        run: npx cap add android

      # --------------------------------------------------
      # 7. Configure Android permissions
      # --------------------------------------------------
      - name: Add Android permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path

          manifest = Path("android/app/src/main/AndroidManifest.xml")

          text = manifest.read_text()

          permissions = [
              '<uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />',
              '<uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />',
              '<uses-permission android:name="android.permission.RECORD_AUDIO" />'
          ]

          for permission in permissions:
              if permission not in text:
                  text = text.replace(
                      '<manifest',
                      '<manifest',
                      1
                  )

                  first_tag_end = text.find('>')

                  text = (
                      text[:first_tag_end + 1]
                      + '\n    '
                      + permission
                      + text[first_tag_end + 1:]
                  )

          manifest.write_text(text)

          print("Android permissions configured successfully.")
          PY

      # --------------------------------------------------
      # 8. Configure Android SDK / Java compatibility
      # --------------------------------------------------
      - name: Configure Android Java compatibility
        run: |
          python3 - <<'PY'
          from pathlib import Path

          gradle_file = Path("android/app/build.gradle")

          text = gradle_file.read_text()

          if "compileOptions" not in text:
              marker = "android {"

              addition = """
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_21
                  targetCompatibility JavaVersion.VERSION_21
              }
              """

              text = text.replace(
                  marker,
                  marker + addition,
                  1
              )

          gradle_file.write_text(text)
          PY

      # --------------------------------------------------
      # 9. Copy web application into Android project
      # --------------------------------------------------
      - name: Copy web application
        run: npx cap copy android

      # --------------------------------------------------
      # 10. Sync Capacitor
      # --------------------------------------------------
      - name: Sync Capacitor
        run: npx cap sync android

      # --------------------------------------------------
      # 11. Generate signing keystore
      # --------------------------------------------------
      - name: Generate release keystore
        run: |
          keytool -genkeypair \
            -v \
            -keystore fisherSafe-release.keystore \
            -alias fishersafe \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass FisherSafe123 \
            -keypass FisherSafe123 \
            -dname "CN=FisherSafe, OU=Research, O=FisherSafe, L=Uyo, ST=Akwa Ibom, C=NG"

      # --------------------------------------------------
      # 12. Configure release signing
      # --------------------------------------------------
      - name: Configure release signing
        run: |
          cat >> android/gradle.properties <<'EOF'

          FISHERSAFE_KEYSTORE=../fisherSafe-release.keystore
          FISHERSAFE_KEY_ALIAS=fishersafe
          FISHERSAFE_KEYSTORE_PASSWORD=FisherSafe123
          FISHERSAFE_KEY_PASSWORD=FisherSafe123
          EOF

          python3 - <<'PY'
          from pathlib import Path

          gradle_file = Path("android/app/build.gradle")

          text = gradle_file.read_text()

          signing_block = """
              signingConfigs {
                  release {
                      storeFile file(project.findProperty("FISHERSAFE_KEYSTORE"))
                      storePassword project.findProperty("FISHERSAFE_KEYSTORE_PASSWORD")
                      keyAlias project.findProperty("FISHERSAFE_KEY_ALIAS")
                      keyPassword project.findProperty("FISHERSAFE_KEY_PASSWORD")
                  }
              }
          """

          if "signingConfigs" not in text:
              text = text.replace(
                  "android {",
                  "android {" + signing_block,
                  1
              )

          if "signingConfig signingConfigs.release" not in text:
              text = text.replace(
                  "buildTypes {",
                  """buildTypes {
                      release {
                          signingConfig signingConfigs.release
                          minifyEnabled false
                          shrinkResources false
                      }
                  """,
                  1
              )

          gradle_file.write_text(text)
          PY

      # --------------------------------------------------
      # 13. Build signed release APK
      # --------------------------------------------------
      - name: Build signed FisherSafe release APK
        working-directory: android
        run: ./gradlew assembleRelease

      # --------------------------------------------------
      # 14. Rename APK
      # --------------------------------------------------
      - name: Rename APK
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk FisherSafe-release.apk

      # --------------------------------------------------
      # 15. Upload final APK
      # --------------------------------------------------
      - name: Upload FisherSafe release APK
        uses: actions/upload-artifact@v4
        with:
          name: FisherSafe-release-apk
          path: FisherSafe-release.apk
          if-no-files-found: error

      # --------------------------------------------------
      # 16. Upload keystore as build artifact
      # --------------------------------------------------
      - name: Upload release keystore
        uses: actions/upload-artifact@v4
        with:
          name: FisherSafe-release-keystore
          path: fisherSafe-release.keystore
          if-no-files-found: error
