name: Build FisherSafe Signed APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # 2. SETUP NODE.JS
      # ============================================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # ============================================================
      # 3. SETUP JAVA
      # ============================================================
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # ============================================================
      # 4. VERIFY WWW APPLICATION
      # ============================================================
      - name: Verify FisherSafe web application
        run: |
          echo "Checking FisherSafe web application..."

          if [ ! -d "www" ]; then
            echo "ERROR: www directory does not exist."
            exit 1
          fi

          if [ ! -f "www/index.html" ]; then
            echo "ERROR: www/index.html does not exist."
            exit 1
          fi

          echo "www/index.html found."
          echo "Web application is ready."

      # ============================================================
      # 5. CREATE PACKAGE.JSON
      # ============================================================
      - name: Create package.json
        run: |
          cat > package.json <<'EOF'
          {
            "name": "fishersafe",
            "version": "1.0.0",
            "private": true,
            "description": "FisherSafe Maritime Safety Monitor",
            "scripts": {
              "build": "echo FisherSafe web application"
            },
            "dependencies": {
              "@capacitor/core": "7.6.8",
              "@capacitor/android": "7.6.8"
            },
            "devDependencies": {
              "@capacitor/cli": "7.6.8",
              "typescript": "5.8.3"
            }
          }
          EOF

          echo "package.json created."

      # ============================================================
      # 6. INSTALL DEPENDENCIES
      # ============================================================
      - name: Install dependencies
        run: |
          npm install

          echo "===== Installed Capacitor packages ====="
          npm list @capacitor/core @capacitor/android @capacitor/cli

      # ============================================================
      # 7. VERIFY PACKAGE LOCK
      # ============================================================
      - name: Verify package-lock.json
        run: |
          if [ ! -f package-lock.json ]; then
            echo "ERROR: package-lock.json was not created."
            exit 1
          fi

          echo "package-lock.json exists."

      # ============================================================
      # 8. CREATE CAPACITOR CONFIG
      # ============================================================
      - name: Create Capacitor configuration
        run: |
          cat > capacitor.config.ts <<'EOF'
          import type { CapacitorConfig } from '@capacitor/cli';

          const config: CapacitorConfig = {
            appId: 'com.fishersafe.app',
            appName: 'FisherSafe',
            webDir: 'www',
            bundledWebRuntime: false,
            android: {
              allowMixedContent: false
            }
          };

          export default config;
          EOF

          echo "Capacitor configuration created."

      # ============================================================
      # 9. REMOVE OLD ANDROID PROJECT
      # ============================================================
      - name: Prepare clean Android project
        run: |
          if [ -d "android" ]; then
            echo "Removing previous Android project..."
            rm -rf android
          fi

          echo "Clean Android build environment prepared."

      # ============================================================
      # 10. CREATE ANDROID PROJECT
      # ============================================================
      - name: Create Android project
        run: |
          npx cap add android

      # ============================================================
      # 11. VERIFY ANDROID PROJECT
      # ============================================================
      - name: Verify Android project
        run: |
          if [ ! -d "android" ]; then
            echo "ERROR: Android project was not created."
            exit 1
          fi

          if [ ! -f "android/app/src/main/AndroidManifest.xml" ]; then
            echo "ERROR: AndroidManifest.xml not found."
            exit 1
          fi

          echo "Android project created successfully."

      # ============================================================
      # 12. ADD GPS AND MICROPHONE PERMISSIONS
      # ============================================================
      - name: Configure GPS and microphone permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          manifest = Path(
              "android/app/src/main/AndroidManifest.xml"
          )

          text = manifest.read_text(encoding="utf-8")

          required_permissions = [
              "android.permission.ACCESS_FINE_LOCATION",
              "android.permission.ACCESS_COARSE_LOCATION",
              "android.permission.RECORD_AUDIO"
          ]

          # --------------------------------------------------------
          # Find manifest opening tag
          # --------------------------------------------------------
          match = re.search(
              r'<manifest\b[^>]*>',
              text
          )

          if not match:
              raise RuntimeError(
                  "ERROR: Could not find valid manifest opening tag."
              )

          insert_position = match.end()

          additions = ""

          for permission in required_permissions:

              if permission not in text:
                  additions += (
                      f'\n    <uses-permission '
                      f'android:name="{permission}" />'
                  )

          if additions:
              text = (
                  text[:insert_position]
                  + additions
                  + text[insert_position:]
              )

          manifest.write_text(
              text,
              encoding="utf-8"
          )

          print(
              "GPS and microphone permissions configured successfully."
          )
          PY

      # ============================================================
      # 13. VERIFY MANIFEST
      # ============================================================
      - name: Verify Android Manifest
        run: |
          echo "===== AndroidManifest.xml ====="
          cat android/app/src/main/AndroidManifest.xml

          echo ""
          echo "===== Permission checks ====="

          grep -q \
            "android.permission.ACCESS_FINE_LOCATION" \
            android/app/src/main/AndroidManifest.xml \
            || {
              echo "ERROR: Fine GPS permission missing."
              exit 1
            }

          grep -q \
            "android.permission.ACCESS_COARSE_LOCATION" \
            android/app/src/main/AndroidManifest.xml \
            || {
              echo "ERROR: Coarse GPS permission missing."
              exit 1
            }

          grep -q \
            "android.permission.RECORD_AUDIO" \
            android/app/src/main/AndroidManifest.xml \
            || {
              echo "ERROR: Microphone permission missing."
              exit 1
            }

          echo "All required permissions are present."

      # ============================================================
      # 14. COPY WEB APPLICATION
      # ============================================================
      - name: Copy FisherSafe web application
        run: |
          npx cap copy android

      # ============================================================
      # 15. CAPACITOR SYNC
      # ============================================================
      - name: Sync Capacitor
        run: |
          npx cap sync android

      # ============================================================
      # 16. VERIFY PERMISSIONS AFTER SYNC
      # ============================================================
      - name: Verify permissions after Capacitor sync
        run: |
          grep -q \
            "android.permission.ACCESS_FINE_LOCATION" \
            android/app/src/main/AndroidManifest.xml \
            || {
              echo "ERROR: GPS permission disappeared after sync."
              exit 1
            }

          grep -q \
            "android.permission.ACCESS_COARSE_LOCATION" \
            android/app/src/main/AndroidManifest.xml \
            || {
              echo "ERROR: Coarse GPS permission disappeared."
              exit 1
            }

          grep -q \
            "android.permission.RECORD_AUDIO" \
            android/app/src/main/AndroidManifest.xml \
            || {
              echo "ERROR: Microphone permission disappeared."
              exit 1
            }

          echo "Permissions remain present after Capacitor sync."

      # ============================================================
      # 17. CREATE RELEASE KEYSTORE
      # ============================================================
      - name: Generate release keystore
        run: |
          KEYSTORE="$GITHUB_WORKSPACE/fisherSafe-release.keystore"

          rm -f "$KEYSTORE"

          keytool -genkeypair \
            -v \
            -keystore "$KEYSTORE" \
            -alias fishersafe \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass FisherSafe123 \
            -keypass FisherSafe123 \
            -dname "CN=FisherSafe, OU=Research, O=FisherSafe, L=Uyo, ST=Akwa Ibom, C=NG"

          if [ ! -f "$KEYSTORE" ]; then
            echo "ERROR: Keystore was not created."
            exit 1
          fi

          echo "Keystore successfully created:"
          ls -lh "$KEYSTORE"

      # ============================================================
      # 18. CONFIGURE RELEASE SIGNING
      # ============================================================
      - name: Configure release signing
        run: |
          cat >> android/gradle.properties <<EOF

          FISHERSAFE_KEYSTORE=$GITHUB_WORKSPACE/fisherSafe-release.keystore
          FISHERSAFE_KEY_ALIAS=fishersafe
          FISHERSAFE_KEYSTORE_PASSWORD=FisherSafe123
          FISHERSAFE_KEY_PASSWORD=FisherSafe123
          EOF

          python3 - <<'PY'
          from pathlib import Path

          gradle = Path("android/app/build.gradle")

          text = gradle.read_text(encoding="utf-8")

          # --------------------------------------------------------
          # Add signing configuration
          # --------------------------------------------------------
          signing_config = """
              signingConfigs {
                  release {
                      storeFile file(project.property("FISHERSAFE_KEYSTORE"))
                      storePassword project.property("FISHERSAFE_KEYSTORE_PASSWORD")
                      keyAlias project.property("FISHERSAFE_KEY_ALIAS")
                      keyPassword project.property("FISHERSAFE_KEY_PASSWORD")
                  }
              }
          """

          if "signingConfigs {" not in text:
              text = text.replace(
                  "android {",
                  "android {" + signing_config,
                  1
              )

          # --------------------------------------------------------
          # Replace the existing release build configuration safely
          # --------------------------------------------------------
          if "signingConfig signingConfigs.release" not in text:

              release_config = """
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled false
                      shrinkResources false
                  }
              """

              if "buildTypes {" in text:
                  text = text.replace(
                      "buildTypes {",
                      "buildTypes {" + release_config,
                      1
                  )
              else:
                  raise RuntimeError(
                      "ERROR: buildTypes block was not found."
                  )

          gradle.write_text(
              text,
              encoding="utf-8"
          )

          print("Release signing configuration added.")
          PY

      # ============================================================
      # 19. VERIFY KEYSTORE AND SIGNING
      # ============================================================
      - name: Verify release signing
        run: |
          KEYSTORE="$GITHUB_WORKSPACE/fisherSafe-release.keystore"

          echo "Checking keystore..."

          if [ ! -f "$KEYSTORE" ]; then
            echo "ERROR: Keystore does not exist."
            exit 1
          fi

          echo "Keystore exists."

          echo ""
          echo "Checking Gradle signing configuration..."

          grep -n \
            "FISHERSAFE_KEYSTORE" \
            android/gradle.properties

          grep -n \
            "signingConfig signingConfigs.release" \
            android/app/build.gradle

          echo "Signing configuration verified."

      # ============================================================
      # 20. VERIFY WEB APP WAS COPIED
      # ============================================================
      - name: Verify Android web assets
        run: |
          if [ ! -f \
            "android/app/src/main/assets/public/index.html" ]; then

            echo "ERROR: FisherSafe index.html was not copied."
            exit 1
          fi

          echo "FisherSafe index.html found in Android assets."

      # ============================================================
      # 21. BUILD RELEASE APK
      # ============================================================
      - name: Build signed FisherSafe release APK
        working-directory: android
        run: |
          chmod +x gradlew

          ./gradlew clean

          ./gradlew assembleRelease --stacktrace

      # ============================================================
      # 22. VERIFY APK
      # ============================================================
      - name: Verify generated APK
        run: |
          APK="android/app/build/outputs/apk/release/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: app-release.apk was not created."
            exit 1
          fi

          echo "======================================"
          echo "FisherSafe release APK created!"
          echo "======================================"

          ls -lh "$APK"

      # ============================================================
      # 23. RENAME APK
      # ============================================================
      - name: Rename final APK
        run: |
          cp \
            android/app/build/outputs/apk/release/app-release.apk \
            FisherSafe-release.apk

          echo "Final APK:"
          ls -lh FisherSafe-release.apk

      # ============================================================
      # 24. UPLOAD APK
      # ============================================================
      - name: Upload FisherSafe release APK
        uses: actions/upload-artifact@v4
        with:
          name: FisherSafe-release-apk
          path: FisherSafe-release.apk
          if-no-files-found: error
