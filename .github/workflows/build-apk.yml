name: Build FisherSafe Signed APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------
      # 1. Checkout repository
      # --------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # --------------------------------------------------
      # 2. Setup Node.js 24
      # --------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # --------------------------------------------------
      # 3. Setup Java 21
      # --------------------------------------------------
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # --------------------------------------------------
      # 4. Install dependencies
      # --------------------------------------------------
      - name: Install dependencies
        run: npm install

      # --------------------------------------------------
      # 5. Ensure TypeScript is installed
      # --------------------------------------------------
      - name: Ensure TypeScript
        run: npm install --save-dev typescript

      # --------------------------------------------------
      # 6. Create Android project
      # --------------------------------------------------
      - name: Create Android project
        run: npx cap add android

      # --------------------------------------------------
      # 7. Add Android permissions safely
      # --------------------------------------------------
      - name: Configure Android permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path

          manifest = Path("android/app/src/main/AndroidManifest.xml")

          text = manifest.read_text()

          permissions = [
              '<uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />',
              '<uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />',
              '<uses-permission android:name="android.permission.RECORD_AUDIO" />'
          ]

          insert_position = text.find(">") + 1

          for permission in permissions:
              if permission not in text:
                  text = (
                      text[:insert_position]
                      + "\n    "
                      + permission
                      + text[insert_position:]
                  )
                  insert_position = text.find(">") + 1

          manifest.write_text(text)

          print("Android permissions configured successfully.")
          PY

      # --------------------------------------------------
      # 8. Configure Java 21
      # --------------------------------------------------
      - name: Configure Java 21 compatibility
        run: |
          python3 - <<'PY'
          from pathlib import Path

          gradle_file = Path("android/app/build.gradle")
          text = gradle_file.read_text()

          if "sourceCompatibility JavaVersion.VERSION_21" not in text:

              compile_block = """
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_21
                  targetCompatibility JavaVersion.VERSION_21
              }
              """

              text = text.replace(
                  "android {",
                  "android {" + compile_block,
                  1
              )

          gradle_file.write_text(text)

          print("Java 21 compatibility configured.")
          PY

      # --------------------------------------------------
      # 9. Copy web application
      # --------------------------------------------------
      - name: Copy web application
        run: npx cap copy android

      # --------------------------------------------------
      # 10. Sync Capacitor
      # --------------------------------------------------
      - name: Sync Capacitor
        run: npx cap sync android

      # --------------------------------------------------
      # 11. Generate release keystore INSIDE android folder
      # --------------------------------------------------
      - name: Generate release keystore
        working-directory: android
        run: |
          keytool -genkeypair \
            -v \
            -keystore fisherSafe-release.keystore \
            -alias fishersafe \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass FisherSafe123 \
            -keypass FisherSafe123 \
            -dname "CN=FisherSafe, OU=Research, O=FisherSafe, L=Uyo, ST=Akwa Ibom, C=NG"

          echo "Keystore created successfully."
          ls -lh fisherSafe-release.keystore

      # --------------------------------------------------
      # 12. Configure signing properties
      # --------------------------------------------------
      - name: Configure signing
        run: |
          cat >> android/gradle.properties <<'EOF'

          FISHERSAFE_KEYSTORE=fisherSafe-release.keystore
          FISHERSAFE_KEY_ALIAS=fishersafe
          FISHERSAFE_KEYSTORE_PASSWORD=FisherSafe123
          FISHERSAFE_KEY_PASSWORD=FisherSafe123
          EOF

          python3 - <<'PY'
          from pathlib import Path

          gradle_file = Path("android/app/build.gradle")
          text = gradle_file.read_text()

          # Add signing configuration
          if "signingConfigs {" not in text:

              signing = """
              signingConfigs {
                  release {
                      storeFile file(project.findProperty("FISHERSAFE_KEYSTORE"))
                      storePassword project.findProperty("FISHERSAFE_KEYSTORE_PASSWORD")
                      keyAlias project.findProperty("FISHERSAFE_KEY_ALIAS")
                      keyPassword project.findProperty("FISHERSAFE_KEY_PASSWORD")
                  }
              }
              """

              text = text.replace(
                  "android {",
                  "android {" + signing,
                  1
              )

          # Replace release build type if necessary
          if "signingConfig signingConfigs.release" not in text:

              release_block = """
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled false
                      shrinkResources false
                  }
              """

              text = text.replace(
                  "buildTypes {",
                  "buildTypes {" + release_block,
                  1
              )

          gradle_file.write_text(text)

          print("Release signing configuration completed.")
          PY

      # --------------------------------------------------
      # 13. Verify keystore and signing configuration
      # --------------------------------------------------
      - name: Verify signing configuration
        run: |
          echo "Checking keystore..."
          ls -lh android/fisherSafe-release.keystore

          echo ""
          echo "Checking Gradle properties..."
          grep "FISHERSAFE_" android/gradle.properties

          echo ""
          echo "Checking signing configuration..."
          grep -n "signingConfigs" android/app/build.gradle || true
          grep -n "signingConfig signingConfigs.release" android/app/build.gradle || true

      # --------------------------------------------------
      # 14. Build signed release APK
      # --------------------------------------------------
      - name: Build FisherSafe release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew clean
          ./gradlew assembleRelease

      # --------------------------------------------------
      # 15. Rename final APK
      # --------------------------------------------------
      - name: Rename APK
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk FisherSafe-release.apk

          echo "Final APK created:"
          ls -lh FisherSafe-release.apk

      # --------------------------------------------------
      # 16. Upload final APK
      # --------------------------------------------------
      - name: Upload FisherSafe release APK
        uses: actions/upload-artifact@v4
        with:
          name: FisherSafe-release-apk
          path: FisherSafe-release.apk
          if-no-files-found: error
