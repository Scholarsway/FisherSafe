name: Build FisherSafe APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm install

      - name: Create Android project
        run: npx cap add android

      - name: Configure Android project
        shell: bash
        run: |
          echo "Configuring FisherSafe Android project..."

          # Show generated Android variables
          echo "----- variables.gradle -----"
          cat android/variables.gradle
          echo "----------------------------"

          # Configure application ID and app name
          python3 - <<'PY'
          from pathlib import Path

          manifest = Path("android/app/src/main/AndroidManifest.xml")

          if manifest.exists():
              text = manifest.read_text()

              # Ensure the manifest has Android 10-compatible
              # network security configuration.
              text = text.replace(
                  '<manifest xmlns:android="http://schemas.android.com/apk/res/android">',
                  '<manifest xmlns:android="http://schemas.android.com/apk/res/android">'
              )

              manifest.write_text(text)

          print("Android project configuration completed.")
          PY

      - name: Copy web application
        run: npx cap copy android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Verify Android project
        run: |
          echo "Checking Android project..."
          test -f android/app/build.gradle
          test -f android/gradlew
          test -f android/app/src/main/AndroidManifest.xml
          echo "Android project verification successful."

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Verify APK
        run: |
          echo "Checking generated APK..."
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk
          file android/app/build/outputs/apk/debug/app-debug.apk

      - name: Rename APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk FisherSafe.apk

      - name: Upload FisherSafe APK
        uses: actions/upload-artifact@v4
        with:
          name: FisherSafe-Android-APK
          path: FisherSafe.apk
          if-no-files-found: error
